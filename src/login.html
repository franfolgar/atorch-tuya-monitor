<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Monitor de energía</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f3ef; --surface: #fcfcfb; --text: #0b0b0b; --text-2: #52514e;
    --border: rgba(11,11,11,.14); --accent: #2a78d6; --critical: #b52f2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110; --surface: #1a1a19; --text: #f0efec; --text-2: #c3c2b7;
      --border: rgba(255,255,255,.14); --accent: #3987e5; --critical: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  form {
    width: 100%; max-width: 360px; padding: 28px; display: grid; gap: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  }
  h1 { margin: 0; font-size: 22px; line-height: 1.2; }
  p { margin: 0; color: var(--text-2); font-size: 14px; }
  label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
  input {
    width: 100%; min-height: 44px; padding: 0 12px; font: inherit; color: inherit;
    background: transparent; border: 1px solid var(--border); border-radius: 8px;
  }
  button {
    min-height: 44px; font: inherit; font-weight: 600; color: #fff; cursor: pointer;
    background: var(--accent); border: 0; border-radius: 8px;
  }
  .error { color: var(--critical); font-weight: 600; }
  .error:empty { display: none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Monitor de energía</h1>
  <p>ATORCH · Tuya / Smart Life</p>
  <label>Contraseña
    <input type="password" name="password" autocomplete="current-password" required autofocus maxlength="256">
  </label>
  <p class="error" role="alert">__ERROR__</p>
  <button type="submit">Entrar</button>
</form>
</body>
</html>
