name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate Worker config / Validar la configuración
        run: |
          cp wrangler.example.toml wrangler.toml
          sed -i 's/REPLACE_WITH_YOUR_KV_NAMESPACE_ID/00000000000000000000000000000000/' wrangler.toml
          npx wrangler deploy --dry-run --outdir dist
